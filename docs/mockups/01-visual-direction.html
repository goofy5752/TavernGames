<meta name="darkreader-lock">
<meta name="color-scheme" content="dark light"><style>:root{color-scheme:dark light}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=Ruslan+Display&family=Philosopher:wght@400;700&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">

<style>
  .dir-wrap { display: flex; flex-direction: column; gap: 2.5rem; max-width: 1200px; margin: 0 auto; }
  .dir { display: grid; grid-template-columns: 280px 1fr; gap: 1.75rem; align-items: center; padding: 1.25rem; border-radius: 14px; border: 2px solid transparent; cursor: pointer; transition: border-color .15s; }
  .dir:hover { border-color: var(--border); }
  .dir.selected { border-color: var(--selected-border); background: var(--selected-bg); }
  .dir-copy h3 { font-size: 1.25rem; margin-bottom: .4rem; }
  .dir-copy p { color: var(--text-secondary); font-size: .9rem; margin-bottom: .6rem; }
  .dir-copy .swatches { display: flex; gap: 6px; margin-top: .5rem; }
  .dir-copy .swatches span { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15); }
  .dir-copy .letter-tag { display: inline-block; font-weight: 700; color: var(--accent); margin-right: .35rem; }

  /* ===== WINDOW (shared skeleton) ===== */
  .win { position: relative; width: 100%; max-width: 820px; aspect-ratio: 720 / 470; border-radius: var(--win-r); overflow: hidden;
         background: var(--frame); box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 0 0 1px var(--frame-line); padding: var(--frame-w); }
  .win-title { position: absolute; top: 0; left: 0; right: 0; height: 34px; display: flex; align-items: center; justify-content: center;
               font-family: var(--f-title); color: var(--title-ink); font-size: var(--title-size); letter-spacing: var(--title-track); z-index: 3; }
  .win-close { position: absolute; right: 12px; top: 8px; width: 18px; height: 18px; border-radius: 50%; background: var(--close-bg); color: var(--title-ink); font: 700 11px/18px sans-serif; text-align: center; }
  .felt { position: relative; width: 100%; height: 100%; margin-top: 18px; height: calc(100% - 18px); border-radius: var(--felt-r); background: var(--felt); box-shadow: inset 0 0 60px rgba(0,0,0,.55), inset 0 0 0 2px var(--felt-edge); overflow: hidden; }

  /* table centre */
  .contract { position: absolute; left: 14px; top: 12px; font-family: var(--f-ui); color: var(--ink); font-size: 12px; line-height: 1.35; background: var(--plate); padding: 7px 10px; border-radius: var(--plate-r); border: 1px solid var(--plate-line); }
  .contract b { font-family: var(--f-title); font-size: 15px; font-weight: 700; color: var(--accent2); display: block; letter-spacing: var(--title-track); }
  .score { position: absolute; right: 14px; top: 12px; font-family: var(--f-ui); color: var(--ink); background: var(--plate); border: 1px solid var(--plate-line); border-radius: var(--plate-r); padding: 7px 12px; font-size: 12px; text-align: right; }
  .score .num { font-family: var(--f-title); font-size: 18px; color: var(--accent2); }
  .score small { opacity: .65; }

  .seat { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--f-ui); }
  .seat .plate { background: var(--plate); border: 1px solid var(--plate-line); border-radius: var(--plate-r); padding: 4px 10px; font-size: 11.5px; color: var(--ink); white-space: nowrap; }
  .seat .plate i { font-style: normal; font-weight: 700; }
  .seat .backs { display: flex; }
  .seat .backs span { width: 22px; height: 32px; margin-left: -12px; border-radius: 3px; background: var(--back); border: 1px solid var(--back-line); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .seat.top { top: 12px; left: 50%; transform: translateX(-50%); }
  .seat.left { left: 18px; top: 42%; }
  .seat.right { right: 18px; top: 42%; }
  .seat.left .backs, .seat.right .backs { flex-direction: column; }
  .seat.left .backs span, .seat.right .backs span { width: 32px; height: 22px; margin: -12px 0 0 0; }
  .bubble { position: absolute; left: 92px; top: 37%; font-family: var(--f-title); font-size: 13px; color: var(--bubble-ink); background: var(--bubble); padding: 4px 10px; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,.35); }

  .trick { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); width: 170px; height: 130px; }
  .trick > div { position: absolute; }
  .trick .t-top { left: 62px; top: 0; transform: rotate(-4deg); }
  .trick .t-left { left: 18px; top: 34px; transform: rotate(-14deg); }
  .trick .t-right { left: 106px; top: 34px; transform: rotate(10deg); }

  .pc { width: 46px; height: 66px; border-radius: 5px; background: var(--card); border: 1px solid var(--card-line); box-shadow: 0 2px 6px rgba(0,0,0,.45); position: relative; font-family: var(--f-card); }
  .pc .r { position: absolute; left: 4px; top: 2px; font-size: 14px; font-weight: 700; line-height: 1; }
  .pc .s { position: absolute; left: 4px; top: 16px; font-size: 11px; line-height: 1; }
  .pc .big { position: absolute; right: 5px; bottom: 3px; font-size: 24px; line-height: 1; }
  .pc.red { color: var(--red); } .pc.black { color: var(--black); }

  .hand { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; }
  .hand .pc { width: 52px; height: 76px; margin-left: -10px; transition: transform .15s; }
  .hand .pc .r { font-size: 16px; }
  .hand .pc .big { font-size: 28px; }
  .hand .pc.ok { transform: translateY(-10px); box-shadow: 0 0 0 2px var(--glow), 0 6px 14px rgba(0,0,0,.5); }
  .hand .pc.no { filter: brightness(.55) saturate(.6); }
  .you { position: absolute; left: 18px; bottom: 16px; font-family: var(--f-ui); }
  .you .plate { background: var(--plate); border: 1px solid var(--glow); border-radius: var(--plate-r); padding: 4px 10px; font-size: 11.5px; color: var(--ink); }
  .timer { margin-top: 5px; height: 4px; width: 100%; background: rgba(0,0,0,.4); border-radius: 2px; overflow: hidden; }
  .timer::after { content: ""; display: block; width: 62%; height: 100%; background: var(--glow); }
  .stake { position: absolute; right: 18px; bottom: 16px; font-family: var(--f-ui); font-size: 11.5px; color: var(--ink); background: var(--plate); border: 1px solid var(--plate-line); border-radius: var(--plate-r); padding: 5px 10px; }
  .stake b { color: #f2c94c; }

  /* ===== THEME A: Механа (walnut + oxblood felt + brass) ===== */
  .t-a { --win-r: 10px; --frame-w: 10px; --frame: linear-gradient(135deg,#4a2c1a,#2e190e 45%,#553220); --frame-line: #8a5a2b;
    --f-title: 'Alegreya SC', serif; --f-ui: 'Alegreya Sans', sans-serif; --f-card: 'Alegreya Sans', sans-serif;
    --title-ink: #e9c98a; --title-size: 17px; --title-track: .04em; --close-bg: #6b3a1f;
    --felt-r: 6px; --felt: radial-gradient(ellipse at 50% 40%, #7a1f24 0%, #4d1216 60%, #2c090b 100%); --felt-edge: #b0813f;
    --ink: #f3e2c0; --plate: rgba(32,16,8,.78); --plate-line: #a8773b; --plate-r: 4px; --accent2: #e9c98a;
    --back: repeating-linear-gradient(45deg,#3b1d10 0 4px,#5c311a 4px 8px); --back-line: #c19350;
    --card: #fbf3e2; --card-line: #c7ad82; --red: #a3161c; --black: #22170f; --glow: #e9b65a; --bubble: #e9c98a; --bubble-ink: #3b1d10; }

  /* ===== THEME B: Шевица (charcoal linen + embroidered red border) ===== */
  .t-b { --win-r: 2px; --frame-w: 12px;
    --frame: repeating-linear-gradient(90deg, transparent 0 6px, rgba(0,0,0,.12) 6px 7px), #1c1a19; --frame-line: #b3202a;
    --f-title: 'Ruslan Display', serif; --f-ui: 'PT Sans Narrow', sans-serif; --f-card: 'PT Sans Narrow', sans-serif;
    --title-ink: #f1e9dc; --title-size: 18px; --title-track: .08em; --close-bg: #b3202a;
    --felt-r: 0; --felt: radial-gradient(ellipse at 50% 40%, #2b2826 0%, #1a1817 75%); --felt-edge: #b3202a;
    --ink: #f1e9dc; --plate: #121110; --plate-line: #b3202a; --plate-r: 0; --accent2: #e0453f;
    --back: conic-gradient(from 45deg, #b3202a 0 25%, #1c1a19 0 50%, #b3202a 0 75%, #1c1a19 0) 0 0/8px 8px; --back-line: #f1e9dc;
    --card: #f4efe6; --card-line: #d8cfc0; --red: #b3202a; --black: #1c1a19; --glow: #e0453f; --bubble: #b3202a; --bubble-ink: #f4efe6; }
  .t-b .felt::before, .t-b .felt::after { content: ""; position: absolute; left: 0; right: 0; height: 12px; z-index: 1;
    background:
      linear-gradient(45deg, transparent 33%, #b3202a 33% 66%, transparent 66%) 0 0/12px 12px,
      linear-gradient(-45deg, transparent 33%, #b3202a 33% 66%, transparent 66%) 0 0/12px 12px; opacity: .9; }
  .t-b .felt::before { top: 0; } .t-b .felt::after { bottom: 0; }
  .t-b .hand { bottom: 22px; } .t-b .you, .t-b .stake { bottom: 24px; } .t-b .contract, .t-b .score, .t-b .seat.top { top: 20px; }

  /* ===== THEME C: Азерот (native-feeling stone + gold, deep teal felt) ===== */
  .t-c { --win-r: 6px; --frame-w: 9px; --frame: linear-gradient(180deg,#3a3f47,#1f2329); --frame-line: #c9a64b;
    --f-title: 'Philosopher', serif; --f-ui: 'Philosopher', sans-serif; --f-card: 'Philosopher', sans-serif;
    --title-ink: #ffd25a; --title-size: 17px; --title-track: .02em; --close-bg: #7a1414;
    --felt-r: 4px; --felt: radial-gradient(ellipse at 50% 40%, #145a5a 0%, #0c3b3d 60%, #062426 100%); --felt-edge: #c9a64b;
    --ink: #fff1c9; --plate: linear-gradient(#2c2f35,#17191d); --plate-line: #8d7434; --plate-r: 3px; --accent2: #ffd25a;
    --back: radial-gradient(circle at 50% 50%, #c9a64b 0 3px, transparent 4px) 0 0/10px 10px, #1b3b6b; --back-line: #c9a64b;
    --card: #fdf8ea; --card-line: #b9a26a; --red: #b01818; --black: #1b1b1b; --glow: #ffd25a; --bubble: #ffd25a; --bubble-ink: #2a1d00; }
</style>

<h2>Каква да е атмосферата?</h2>
<p class="subtitle">Три посоки, всяка показана с една и съща ръка Белот. Ти си долу, играеш купа. Картите, които можеш да хвърлиш, са повдигнати. Името в рамката е вариант, който подхожда на стила. Кликни посоката, която ти е най-близо, и ми кажи какво да сменим.</p>

<div class="dir-wrap" id="dirs"></div>

<script>
(function () {
  const S = { h: ['♥','red'], d: ['♦','red'], s: ['♠','black'], c: ['♣','black'] };
  const card = (r, s, cls = '') => `<div class="pc ${S[s][1]} ${cls}"><span class="r">${r}</span><span class="s">${S[s][0]}</span><span class="big">${S[s][0]}</span></div>`;
  const hand = [['J','h','ok'],['9','h','ok'],['A','h','ok'],['10','s','no'],['K','s','no'],['Q','d','no'],['7','c','no'],['A','c','no']]
    .map(c => card(...c)).join('');
  const backs = n => '<div class="backs">' + '<span></span>'.repeat(n) + '</div>';

  const table = (theme, title) => `
    <div class="win ${theme}">
      <div class="win-title">${title}</div><div class="win-close">✕</div>
      <div class="felt">
        <div class="contract">Игра<b>♥ Купа · Контра</b>Обяви: Ralitsa</div>
        <div class="score">Ние <span class="num">87</span> &nbsp;:&nbsp; <span class="num">64</span> Те<br><small>до 151 · висят 8</small></div>
        <div class="seat top"><div class="plate"><i style="color:#3FC7EB">Ralitsa Moonbrook</i> · партньор</div>${backs(5)}</div>
        <div class="seat left">${backs(5)}<div class="plate"><i style="color:#C69B6D">Grumbar Ironpot</i></div></div>
        <div class="seat right">${backs(5)}<div class="plate"><i style="color:#FFF468">Velin Ashfield</i></div></div>
        <div class="bubble">Терца!</div>
        <div class="trick">
          <div class="t-left">${card('Q','h')}</div>
          <div class="t-top">${card('10','h')}</div>
          <div class="t-right">${card('8','h')}</div>
        </div>
        <div class="you"><div class="plate"><i style="color:#F48CBA">Ти</i> · твой ход</div><div class="timer"></div></div>
        <div class="hand">${hand}</div>
        <div class="stake">Залог <b>5g</b> на човек</div>
      </div>
    </div>`;

  const dirs = [
    { id: 'a', letter: 'A', name: 'Механа', sub: 'Орехово дърво, бордо сукно и месинг. Топло, като маса в истинска механа на свещи. Най-близо до духа на гилдията.', sw: ['#4a2c1a','#7a1f24','#b0813f','#fbf3e2'], theme: 't-a', title: 'Krachma' },
    { id: 'b', letter: 'B', name: 'Шевица', sub: 'Тъмен лен с червена шевица по ръбовете и шрифт в старобългарски дух. Най-отличаващото се, никой друг аддон не изглежда така.', sw: ['#1c1a19','#b3202a','#f1e9dc','#e0453f'], theme: 't-b', title: 'КОЗ' },
    { id: 'c', letter: 'C', name: 'Азерот', sub: 'Камък и злато като прозорците на самата игра, тъмно тюркоазено сукно. Изглежда като част от WoW, но е най-малко запомнящо се.', sw: ['#2c2f35','#0c3b3d','#c9a64b','#ffd25a'], theme: 't-c', title: 'The Gilded Table' },
  ];

  document.getElementById('dirs').innerHTML = dirs.map(d => `
    <div class="dir" data-choice="${d.id}" onclick="toggleSelect(this)">
      <div class="dir-copy">
        <h3><span class="letter-tag">${d.letter}</span>${d.name}</h3>
        <p>${d.sub}</p>
        <div class="swatches">${d.sw.map(c => `<span style="background:${c}"></span>`).join('')}</div>
      </div>
      ${table(d.theme, d.title)}
    </div>`).join('');
})();
</script>
